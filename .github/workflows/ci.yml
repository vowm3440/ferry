name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run full build, frontend & Go test gates
        shell: pwsh
        run: .\scripts\test.ps1 -Version 0.2.0-ci

      - name: Run live core stability self-check
        shell: pwsh
        run: .\scripts\verify-machine.ps1 -ExpectedVersion 0.2.0-ci

      - name: Verify NSIS installer, portable zip, and GPL source packaging
        shell: pwsh
        run: .\scripts\package.ps1 -Version 0.2.0-ci -SkipBuild -Force

      - name: Upload CI package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferry-ci-artifacts
          path: |
            dist/Ferry-0.2.0-ci-windows-amd64.zip
            dist/Ferry-0.2.0-ci-windows-amd64-setup.exe
            dist/Ferry-0.2.0-ci-source.zip
            dist/Ferry-0.2.0-ci-SHA256SUMS.txt
          if-no-files-found: error
